server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/smartfit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=admin

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

app.bootstrap-admin.enabled=true
app.bootstrap-admin.nombre=Admin
app.bootstrap-admin.apellido=Local
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@local.dev}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

spring.thymeleaf.cache=false
spring.devtools.restart.additional-paths=src/main/resources
spring.devtools.livereload.enabled=true

spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.resources.static-locations=file:src/main/resources/static/,file:src/main/resources/public/
