<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/regismaterial.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <title>Registrar materiales</title>
</head>
<body>
    <header>
        <h1 style=font-size:30px>Smartfit Colaboradores</h1>
      </header>
      
      <nav>
        <ul class="menu-horizontal">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/salas}">Salas disponibles</a></li>
            <li><a th:href="@{/pedirsala}">Reservar sala</a></li>
            <li><a th:href="@{/registrarsalas}">Agregar salas</a></li>
            <li><a th:href="@{/registrarmaterial}">Equipamiento</a></li>
            <li sec:authorize="isAuthenticated()" class="logout-item">
              <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-button">Cerrar sesión</button>
              </form>
            </li>
          </ul>
        <div class="hide">
          <i class="fa fa-bars" aria-hidden="true"></i> Menu
        </div>
      </nav>

  <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

  <section class="form-register">
    <h4>Registro Material</h4>
    <form th:action="@{/registrarmaterial}" th:object="${equipamientoForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input class="controls" type="text" th:field="*{nombre}" placeholder="Nombre del equipamiento" required>
      <select th:field="*{categoria}" class="controls" required>
          <option value="">Categoria</option>
          <option value="Musculacion">Musculacion</option>
          <option value="Cardio">Cardio</option>
          <option value="Movilidad">Movilidad</option>
          <option value="Limpieza">Limpieza</option>
          <option value="Accesorios">Accesorios</option>
      </select>
      <select th:field="*{salaId}" class="controls" required>
          <option value="">Asignar a sala</option>
          <option th:each="sala : ${salas}" th:value="${sala.id}" th:text="${sala.nombre}"></option>
      </select>
      <input class="controls" type="number" th:field="*{cantidad}" placeholder="Cantidad" min="1" required>
      <input class="botons" type="submit" value="Registrar">
    </form>
  </section>

  <section class="page-panel">
    <h3>Equipamiento registrado</h3>
    <table class="data-table" th:if="${!#lists.isEmpty(equipamientos)}">
      <thead>
        <tr>
          <th>Sala</th>
          <th>Equipamiento</th>
          <th>Categoria</th>
          <th>Cantidad</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="equipamiento : ${equipamientos}">
          <td th:text="${equipamiento.salaNombre}"></td>
          <td th:text="${equipamiento.nombre}"></td>
          <td th:text="${equipamiento.categoria}"></td>
          <td th:text="${equipamiento.cantidad}"></td>
        </tr>
      </tbody>
    </table>
    <p class="empty-message" th:if="${#lists.isEmpty(equipamientos)}">Primero registra una sala y luego su equipamiento.</p>
  </section>

  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script>
    $(".hide").on('click', function() {
      $("nav ul").toggle('slow');
    })
  </script> 
</body>
</html>
