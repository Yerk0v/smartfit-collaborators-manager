<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Salas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel='stylesheet' href='https://fonts.googleapis.com/css?family=Playfair+Display:700|Raleway:500.700'>
    <link rel="stylesheet" href="css/sala.css">
</head>
<header>
    <h1 style=font-size:30px>Smartfit Colaboradores</h1>
  </header>
  
<body>
    <nav>
        <ul class="menu-horizontal">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/salas}">Salas disponibles</a></li>
            <li><a th:href="@{/pedirsala}">Reservar sala</a></li>
            <li><a th:href="@{/registrarsalas}">Agregar salas</a></li>
            <li><a th:href="@{/registrarmaterial}">Equipamiento</a></li>
            <li sec:authorize="isAuthenticated()" class="logout-item">
              <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-button">Cerrar sesión</button>
              </form>
            </li>
          </ul>
      </nav>
      <h1 class="title">Salas disponibles</h1>

      <div class="empty-state" th:if="${#lists.isEmpty(salas)}">
        No hay salas registradas todavia. Primero agrega una sala y luego registra su equipamiento.
      </div>

      <div id="app" class="container" th:if="${!#lists.isEmpty(salas)}">
        <card th:each="sala : ${salas}" data-image="https://images.unsplash.com/photo-1571902943202-507ec2618e8f?auto=format&fit=crop&w=1075&q=80">
          <h1 slot="header" th:text="${sala.nombre}"></h1>
          <div slot="content" class="card-meta">
            <span class="status-badge" th:classappend="${sala.disponibleAhora} ? ' is-free' : ' is-busy'" th:text="${sala.estadoActual}"></span>
            <span class="meta-pill" th:text="${sala.tipo}"></span>
            <span class="meta-pill" th:text="${'Aforo: ' + sala.aforo}"></span>
          </div>
          <p slot="content" class="card-copy" th:text="${sala.descripcion != null ? sala.descripcion : 'Sala lista para reservas internas.'}"></p>
          <p slot="content" class="card-copy"><strong>Proxima reserva:</strong> <span th:text="${sala.proximaReserva}"></span></p>
          <ul slot="content" class="equipment-list">
            <li th:each="equipamiento : ${sala.equipamientos}" th:text="${equipamiento}"></li>
          </ul>
        </card>
      </div>
      <script src='https://cdnjs.cloudflare.com/ajax/libs/vue/2.0.1/vue.min.js'></script>
      <script src="scripts/script.js"></script>
</body>
</html>
