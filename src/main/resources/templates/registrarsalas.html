<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/regismaterial.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <title>Registro de salas</title>
</head>
<body>
    <header>
        <h1 style=font-size:30px>Smartfit Colaboradores</h1>
      </header>
      
      <nav>
        <ul class="menu-horizontal">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/salas}">Salas disponibles</a></li>
            <li><a th:href="@{/pedirsala}">Reservar sala</a></li>
            <li><a th:href="@{/registrarsalas}">Agregar salas</a></li>
            <li><a th:href="@{/registrarmaterial}">Equipamiento</a></li>
            <li sec:authorize="isAuthenticated()" class="logout-item">
              <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-button">Cerrar sesión</button>
              </form>
            </li>
          </ul>
      </nav>

      <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
      <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

      <section class="form-register">
        <h4>Registrar Sala</h4>
        <form th:action="@{/registrarsalas}" th:object="${salaForm}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input class="controls" type="text" th:field="*{nombre}" placeholder="Nombre de la sala" required>
          <select th:field="*{tipo}" class="controls" required>
              <option value="">Tipo de sala</option>
              <option value="Musculacion">Musculacion</option>
              <option value="Calentamiento">Calentamiento</option>
              <option value="Yoga">Yoga</option>
              <option value="Calistenia">Calistenia</option>
              <option value="Cardio">Cardio</option>
              <option value="Funcional">Funcional</option>
          </select>
          <input class="controls" type="number" th:field="*{aforo}" placeholder="Aforo" min="1" required>
          <textarea class="controls" th:field="*{descripcion}" placeholder="Descripcion breve de la sala"></textarea>
          <input class="botons" type="submit" value="Registrar">
        </form>
      </section>

      <section class="page-panel">
        <h3>Salas registradas</h3>
        <table class="data-table" th:if="${!#lists.isEmpty(salas)}">
          <thead>
            <tr>
              <th>Sala</th>
              <th>Tipo</th>
              <th>Aforo</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="sala : ${salas}">
              <td th:text="${sala.nombre}"></td>
              <td th:text="${sala.tipo}"></td>
              <td th:text="${sala.aforo}"></td>
              <td th:text="${sala.estadoActual}"></td>
            </tr>
          </tbody>
        </table>
        <p class="empty-message" th:if="${#lists.isEmpty(salas)}">Todavia no hay salas registradas.</p>
      </section>
</body>
</html>
