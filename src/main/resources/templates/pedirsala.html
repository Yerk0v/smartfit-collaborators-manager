<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="css/regismaterial.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <title>Reservar salas</title>
</head>
<body>
    <header>
        <h1 style=font-size:30px>Smartfit Colaboradores</h1>
      </header>
      
      <nav>
        <ul class="menu-horizontal">
            <li><a th:href="@{/}">Inicio</a></li>
            <li><a th:href="@{/salas}">Salas disponibles</a></li>
            <li><a th:href="@{/pedirsala}">Reservar sala</a></li>
            <li><a th:href="@{/registrarsalas}">Agregar salas</a></li>
            <li><a th:href="@{/registrarmaterial}">Equipamiento</a></li>
            <li sec:authorize="isAuthenticated()" class="logout-item">
              <form th:action="@{/logout}" method="post" class="logout-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="logout-button">Cerrar sesión</button>
              </form>
            </li>
          </ul>
        <div class="hide">
          <i class="fa fa-bars" aria-hidden="true"></i> Menu
        </div>
      </nav>

  <div th:if="${exito}" class="alert alert-success" th:text="${exito}"></div>
  <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

  <section class="form-register">
    <h4>Reservar sala</h4>
    <form th:action="@{/pedirsala}" th:object="${reservaForm}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <input class="controls" type="text" th:field="*{nombreSolicitante}" placeholder="Nombre" required>
      <input class="controls" type="text" th:field="*{apellidoSolicitante}" placeholder="Apellido" required>
      <select th:field="*{salaId}" class="controls" required>
          <option value="">Seleccionar sala</option>
          <option th:each="sala : ${salas}" th:value="${sala.id}" th:text="${sala.nombre + ' - ' + sala.tipo}"></option>
      </select>
      <input class="controls" type="date" th:field="*{fecha}" required>
      <input class="controls" type="time" th:field="*{horaInicio}" required>
      <input class="controls" type="time" th:field="*{horaFin}" required>
      <input class="botons" type="submit" value="Reservar">
    </form>
  </section>

  <section class="page-panel">
    <h3>Reservas pendientes</h3>
    <table class="data-table" th:if="${!#lists.isEmpty(reservas)}">
      <thead>
        <tr>
          <th>Sala</th>
          <th>Solicitante</th>
          <th>Fecha</th>
          <th>Horario</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="reserva : ${reservas}">
          <td th:text="${reserva.salaNombre}"></td>
          <td th:text="${reserva.solicitante}"></td>
          <td th:text="${reserva.fecha}"></td>
          <td th:text="${reserva.horario}"></td>
        </tr>
      </tbody>
    </table>
    <p class="empty-message" th:if="${#lists.isEmpty(reservas)}">No hay reservas futuras registradas.</p>
  </section>
</body>
</html>
